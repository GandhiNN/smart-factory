[package]
name = "sfp-sim-core"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = { workspace = true }

# Optional: only pulled in when the `config` feature is enabled, keeping
# the core dependency-minimal by default (protocol-agnostic, no serde tax).
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "1", optional = true }

[features]
# Enables loading a MakerLine from a TOML config ile.
config = ["dep:serde", "dep:toml"]